<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guess Who Dictators</title>
  <link rel="stylesheet" href="guesswhostyles.css" />
</head>

<body>
  <h1>Guess Who Dictators</h1>
  <div class="main">
    <div class="grid" id="board">
      <!-- Cards will be inserted here -->
    </div>
    <div class="sidebar">
      <button id="shuffleButton" title="Randomize the board layout">Shuffle</button>
      <button id="clearButton" title="Uncover all cards">Reset</button>
      <button id="darkModeButton" title="Toggle dark mode">Toggle Dark Mode</button>
      <div class="description-box" id="descriptionBox">
        Hover over a card to see details.
      </div>
    </div>
  </div>

  <script>
    const board = document.getElementById("board");
    const descriptionBox = document.getElementById("descriptionBox");
    const shuffleButton = document.getElementById("shuffleButton");
    const clearButton = document.getElementById("clearButton");
    const darkModeButton = document.getElementById("darkModeButton");

    let characters = [];

    async function fetchCharacters() {
      try {
        const response = await fetch('https://api.jsonbin.io/v3/b/682e4e5b8a456b7966a307a5');
        if (!response.ok) throw new Error("Failed to fetch data");
        const json = await response.json();
        characters = json.record.map((char, i) => ({ ...char, index: i, isCovered: false }));
        renderBoard();
      } catch (error) {
        console.error("Error loading characters:", error);
        characters = Array.from({ length: 24 }, (_, i) => ({
          name: `Character ${i + 1}`,
          img: `https://via.placeholder.com/100?text=C${i + 1}`,
          description: `This is Character ${i + 1}`,
          index: i,
          isCovered: false
        }));
        renderBoard();
      }
    }

    function renderBoard() {
      board.innerHTML = "";
      characters.forEach((char, i) => {
        const card = document.createElement("div");
        card.className = "card";
        if (char.covered) card.classList.add("covered");

        card.dataset.index = i;
        card.dataset.description = char.description;

        const cardInner = document.createElement("div");
        cardInner.className = "card-inner";

        const front = document.createElement("div");
        front.className = "card-front";
        const frontImg = document.createElement("img");
        frontImg.src = char.img;
        frontImg.alt = char.name;
        front.appendChild(frontImg);

        const back = document.createElement("div");
        back.className = "card-back";
        const backImg = document.createElement("img");
        backImg.src = "images/Loveless.png";
        backImg.alt = "Covered";
        back.appendChild(backImg);

        cardInner.appendChild(front);
        cardInner.appendChild(back);
        card.appendChild(cardInner);

        card.addEventListener("click", () => {
          const idx = Number(card.dataset.index);
          characters[idx].covered = !characters[idx].covered;
          card.classList.toggle("covered");
        });

        card.addEventListener("mouseenter", () => {
          descriptionBox.innerHTML = `<div style="text-align:center; font-weight:bold;">${char.name}</div><div>${char.description}</div>`;
        });

        card.addEventListener("mouseleave", () => {
          descriptionBox.textContent = "Hover over a card to see details.";
        });

        board.appendChild(card);
      });
    }

    shuffleButton.addEventListener("click", () => {
      characters = characters.sort(() => Math.random() - 0.5);
      renderBoard();
    });

    clearButton.addEventListener("click", () => {
      characters.forEach(char => {
        char.covered = false;
      });
      renderBoard();
    });

    darkModeButton.addEventListener("click", () => {
      document.body.classList.toggle("dark-mode");
    });

    fetchCharacters();
  </script>
</body>


</html>
