<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guess Who Dictators</title>
  <link rel="stylesheet" href="guesswhostyles.css" />
</head>

<body>
  <h1 id="gameTitle">Guess Who Dictators!</h1>

  <div class="main">
    <div class="grid" id="board">
      <!-- Cards will be inserted here -->
    </div>
    <div class="sidebar">
      <button id="shuffleButton" title="Randomize the board layout">New game</button>
      <button id="clearButton" title="Uncover all cards">Reset</button>
      <div class="description-box" id="descriptionBox">
        Hover over a card to see details.
      </div>
      <button id="hardModeToggle" title="Hides descriptions">Hard mode</button>
      <button id="darkModeToggle" title="Toggles dark mode">Dark mode</button>
    </div>
  </div>

  <script>
    const board = document.getElementById("board");
    const descriptionBox = document.getElementById("descriptionBox");
    const shuffleButton = document.getElementById("shuffleButton");
    const clearButton = document.getElementById("clearButton");
    const toggleDarkButton = document.getElementById("darkModeToggle");
    const toggleHardButton = document.getElementById("hardModeToggle");

    let characters = [];
    let hardMode = false;

    function loadSettings() {
      const dark = localStorage.getItem("darkMode") === "true";
      const hard = localStorage.getItem("hardMode") === "true";

      document.body.classList.toggle("dark-mode", dark);
      hardMode = hard;

      toggleDarkButton.textContent = !dark ? "☀️ Light Mode" : "🌙 Dark Mode";
      toggleHardButton.textContent = !hardMode ? "🔓 Easy Mode" : "🧠 Hard Mode";
    }

    function saveSettings() {
      localStorage.setItem("darkMode", document.body.classList.contains("dark-mode"));
      localStorage.setItem("hardMode", hardMode);
    }

    toggleDarkButton.addEventListener("click", () => {
      const isDark = document.body.classList.toggle("dark-mode");
      toggleDarkButton.textContent = !isDark ? "☀️ Light Mode" : "🌙 Dark Mode";
      saveSettings();
    });

    toggleHardButton.addEventListener("click", () => {
      hardMode = !hardMode;
      toggleHardButton.textContent = !hardMode ? "🔓 Easy Mode" : "🧠 Hard Mode";
      renderBoard();
      saveSettings();
    });

    async function fetchCharacters() {
      try {
        const response = await fetch('data/guesswho_people.json');
        if (!response.ok) throw new Error("Failed to fetch data");
        const data = await response.json();

        characters = data.map((char, i) => ({
          ...char,
          index: i,
          covered: false,
          highlighted: false
        }));

        // Shuffle once on first load
        characters = characters.sort(() => Math.random() - 0.5);

        selectRandomCharacter();

        renderBoard();
      } catch (error) {
        console.error("Error loading characters:", error);
        characters = Array.from({ length: 24 }, (_, i) => ({
          name: `Character ${i + 1}`,
          img: `https://via.placeholder.com/100?text=C${i + 1}`,
          description: `This is Character ${i + 1}`,
          index: i,
          covered: false
        }));
        renderBoard();
      }
    }

    function renderBoard() {
      board.innerHTML = "";
      characters.forEach((char, i) => {
        const card = document.createElement("div");
        card.className = "card";
        if (char.covered) card.classList.add("covered");
        card.dataset.index = i;
        card.dataset.description = char.description;

        const inner = document.createElement("div");
        inner.className = "card-inner";

        const front = document.createElement("div");
        front.className = "card-front";
        const frontImg = document.createElement("img");
        frontImg.src = char.img;
        frontImg.alt = char.name;
        front.appendChild(frontImg);

        const back = document.createElement("div");
        back.className = "card-back";
        const backImg = document.createElement("img");
        backImg.src = "images/guesswho/Loveless.png";
        backImg.alt = "Covered";
        back.appendChild(backImg);

        inner.appendChild(front);
        inner.appendChild(back);
        card.appendChild(inner);

        card.addEventListener("click", () => {
          const idx = Number(card.dataset.index);
          characters[idx].covered = !characters[idx].covered;
          card.classList.toggle("covered");
        });

        card.addEventListener("mouseenter", () => {
          descriptionBox.innerHTML = `<div style="text-align:center; font-weight:bold;">${char.name}</div>` +
            (!hardMode ? `<div>${char.description}</div>` : '');
        });

        card.addEventListener("mouseleave", () => {
          descriptionBox.textContent = "Hover over a card to see details.";
        });

        if (char.highlighted) {
          card.classList.add('highlighted');
        }

        board.appendChild(card);
      });
    }

    function selectRandomCharacter() {
      // Reset all characters
      characters.forEach(char => {
        char.highlighted = false;
      });
      const randomIndex = Math.floor(Math.random() * characters.length);
      characters[randomIndex].highlighted = true;
    }

    shuffleButton.addEventListener("click", () => {
      characters = characters.sort(() => Math.random() - 0.5);
      selectRandomCharacter();
      renderBoard();
    });

    clearButton.addEventListener("click", () => {
      characters.forEach(char => {
        if (char.covered) {
          char.covered = false;
        }
      });
      renderBoard();
    });

    loadSettings();
    fetchCharacters();
  </script>


</body>



</html>
